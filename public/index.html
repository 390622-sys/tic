<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Tic Tac Toe - Accounts</h1>

    <div id="register-section">
        <h2>Register!</h2>
        <form id="register-form">
            <input type="text" id="reg-username" placeholder="Choose a Username" required>
            <input type="password" id="reg-password" placeholder="Choose a Password" required>
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <div id="login-section">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
    </div>


    <div id="game-section" style="display: none;">
        <h2 id="status">Player X's Turn</h2>
        <div id="board" class="grid-container">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="reset-btn">Reset Game</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
